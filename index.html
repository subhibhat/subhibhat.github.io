<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Subhibhat (Oat) Srikam — Go, Next.js &amp; TypeScript developer from Sisaket, Thailand." />
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Subhibhat Srikam</title>
    <script>
      // a remembered theme only counts if the visitor allowed "preferences" (see src/lib/consent.js)
      (() => {
        let theme;
        try {
          const consent = JSON.parse(localStorage.getItem('consent'));
          const fresh = consent?.version === 1 && Date.now() - Date.parse(consent.at) < 365 * 24 * 60 * 60 * 1000;
          if (fresh && consent.preferences) theme = localStorage.getItem('theme');
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
